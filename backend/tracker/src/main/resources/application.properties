spring.application.name=tracker

spring.datasource.url=${TRACKER_DB_URL:jdbc:postgresql://localhost:5432/my_life}
spring.datasource.username=${TRACKER_DB_USERNAME:postgres}
spring.datasource.password=${TRACKER_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=tracker_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8081
server.servlet.context-path=/tracker

tracker.time-zone=${TRACKER_TIME_ZONE:Europe/Moscow}
