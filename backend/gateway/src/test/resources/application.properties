spring.datasource.url=jdbc:h2:mem:gateway-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

gateway.jwt.secret=test-gateway-jwt-secret-with-at-least-32-bytes
gateway.jwt.access-token-ttl=PT1H

gateway.routes[0].prefix=/tracker
gateway.routes[0].target-base-url=http://localhost:8081
