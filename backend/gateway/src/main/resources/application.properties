spring.application.name=gateway

spring.datasource.url=${GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/my_life}
spring.datasource.username=${GATEWAY_DB_USERNAME:postgres}
spring.datasource.password=${GATEWAY_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

gateway.jwt.secret=${GATEWAY_JWT_SECRET:dev-only-insecure-gateway-jwt-secret-change-me}
gateway.jwt.access-token-ttl=${GATEWAY_JWT_ACCESS_TOKEN_TTL:PT15M}

gateway.auth.refresh-token-ttl=${GATEWAY_AUTH_REFRESH_TOKEN_TTL:P7D}
gateway.auth.cookie.secure=${GATEWAY_AUTH_COOKIE_SECURE:true}
gateway.auth.cookie.same-site=${GATEWAY_AUTH_COOKIE_SAME_SITE:Strict}

gateway.routes[0].prefix=/tracker
gateway.routes[0].target-base-url=${GATEWAY_TRACKER_BASE_URL:http://localhost:8081}

gateway.routes[1].prefix=/finances
gateway.routes[1].target-base-url=${GATEWAY_FINANCE_BASE_URL:http://localhost:8082}

gateway.routes[2].prefix=/media
gateway.routes[2].target-base-url=${GATEWAY_MEDIA_BASE_URL:http://localhost:8083}
