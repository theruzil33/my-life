spring.application.name=finance

spring.datasource.url=${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/my_life}
spring.datasource.username=${FINANCE_DB_USERNAME:postgres}
spring.datasource.password=${FINANCE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=finance_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8082
server.servlet.context-path=/finances
