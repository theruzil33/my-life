name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.parse.outputs.valid }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Validate tag matches vD.D.D
        id: parse
        run: |
          ref="${{ github.ref }}"
          tag="${ref#refs/tags/}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$tag' does not match vD.D.D, skipping publish."
          fi

  publish:
    needs: tag
    if: needs.tag.outputs.valid == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: ./backend/gateway
          - name: tracker
            context: ./backend/tracker
          - name: web
            context: ./client/web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push my-life-${{ matrix.name }}
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/my-life-${{ matrix.name }}"
          version="${{ needs.tag.outputs.version }}"
          docker build -t "$image:$version" "${{ matrix.context }}"
          docker push "$image:$version"
