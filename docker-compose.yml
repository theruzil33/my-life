services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_life}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: ./backend/gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-my_life}
      GATEWAY_DB_USERNAME: ${POSTGRES_USER:-postgres}
      GATEWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET in .env}
      GATEWAY_JWT_ACCESS_TOKEN_TTL: ${GATEWAY_JWT_ACCESS_TOKEN_TTL:-PT15M}
      GATEWAY_AUTH_REFRESH_TOKEN_TTL: ${GATEWAY_AUTH_REFRESH_TOKEN_TTL:-P7D}
      GATEWAY_AUTH_COOKIE_SECURE: ${GATEWAY_AUTH_COOKIE_SECURE:-false}
      GATEWAY_AUTH_COOKIE_SAME_SITE: ${GATEWAY_AUTH_COOKIE_SAME_SITE:-Lax}
      GATEWAY_TRACKER_BASE_URL: http://tracker:8081
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/auth/csrf"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  tracker:
    build:
      context: ./backend/tracker
    depends_on:
      postgres:
        condition: service_healthy
      # Tracker выполняет Flyway baseline поверх схемы, созданной gateway,
      # поэтому должен стартовать после успешных миграций gateway.
      gateway:
        condition: service_healthy
    environment:
      TRACKER_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-my_life}
      TRACKER_DB_USERNAME: ${POSTGRES_USER:-postgres}
      TRACKER_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRACKER_TIME_ZONE: ${TRACKER_TIME_ZONE:-Europe/Moscow}
    expose:
      - "8081"
    restart: unless-stopped

  web:
    build:
      context: ./client/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - gateway
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres-data:
