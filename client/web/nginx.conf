server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth {
        proxy_pass http://gateway:8080;
    }

    # SPA-маршрут /tracker должен отдаваться клиентским приложением,
    # а не уходить в API. Точные совпадения имеют приоритет над
    # префиксом /tracker/ ниже.
    location = /tracker {
        try_files /index.html =404;
    }

    location = /tracker/ {
        try_files /index.html =404;
    }

    location /tracker/ {
        proxy_pass http://gateway:8080;
    }

    # SPA-маршрут /finances должен отдаваться клиентским приложением,
    # а не уходить в API. Точные совпадения имеют приоритет над
    # префиксом /finances/ ниже.
    location = /finances {
        try_files /index.html =404;
    }

    location = /finances/ {
        try_files /index.html =404;
    }

    location /finances/ {
        proxy_pass http://gateway:8080;
    }

    # SPA-маршрут /media должен отдаваться клиентским приложением,
    # а не уходить в API. Точные совпадения имеют приоритет над
    # префиксом /media/ ниже.
    location = /media {
        try_files /index.html =404;
    }

    location = /media/ {
        try_files /index.html =404;
    }

    location /media/ {
        proxy_pass http://gateway:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
